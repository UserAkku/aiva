[project]
name = "aiva"
version = "0.1.0"
description = "AIVA — a voice-first AI desk companion: an ESP32-S3 face with a MacBook brain."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    # --- server ---
    "fastapi>=0.160",
    "uvicorn[standard]>=0.50",
    "python-multipart>=0.0.20",
    # --- config / infra ---
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "tzlocal>=5.0",
    # --- brain: agent framework + LLM providers (all free tiers) ---
    "pydantic-ai-slim[openai,groq,google,mistral,cerebras,mcp]>=2.70",
    # --- voice ---
    "numpy>=2.2",
    "onnxruntime>=1.20",   # Silero VAD (ONNX, no torch)
    "soxr>=0.5",           # high quality resampling
    "miniaudio>=1.60",     # mp3 -> pcm decode (edge-tts output)
    "edge-tts>=7.0",       # free neural TTS (Hindi + Indian English voices)
    # --- tools ---
    "ddgs>=9.0",           # DuckDuckGo search, no API key
    "trafilatura>=2.0",    # clean article text from web pages
    "pymupdf>=1.26",       # create / read / edit PDFs
    "simpleeval>=1.0",     # safe calculator
]

[project.optional-dependencies]
# Real ESP32 hardware streams Opus audio. Needs the system lib: `brew install opus`
hardware = ["opuslib>=3.0.1"]

[project.scripts]
aiva = "aiva.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiva"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
